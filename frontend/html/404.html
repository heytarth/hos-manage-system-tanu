<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; text-align: center;">
    <h1 style="font-size: 72px; color: var(--primary-color); margin-bottom: 10px;">404</h1>
    <h2 style="font-size: 28px; margin-bottom: 10px;">Page Not Found</h2>
    <p style="color: var(--gray); margin-bottom: 30px;">The page you're looking for doesn't exist.</p>
    <a href="/" class="btn btn-primary">Go Back Home</a>
  </div>
</body>
</html>
